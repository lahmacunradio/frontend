services:
  app:
    build: ./app
    ports:
      - 3333:3333
    command: pnpm dev
    volumes:
      - ./app:/src
      - /src/node_modules
      - pnpm-store:/pnpm/store
    environment:
      - HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
  proxy:
    image: nginx:1.19
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - challenge:/var/www/html
      - certbot-etc:/etc/letsencrypt
      - ./nginx:/etc/nginx/conf.d
    depends_on:
      - app

  certbot:
    depends_on:
      - proxy
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - challenge:/var/www/html
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  certbot-etc:
  challenge:
  pnpm-store:
