version: '3'

services:
  app:
    build:
      context: ./app
      args:
        # Pass build-time arguments for Nuxt build process
        - ARCSI_TOKEN=${ARCSI_TOKEN}
        - SENTRY_DSN=${SENTRY_DSN}
        - DONATE_STRIPE_FORM_URL=${DONATE_STRIPE_FORM_URL}
        - MEMBERSHIP_STRIPE_FORM_URL=${MEMBERSHIP_STRIPE_FORM_URL}
        - SUBSCRIPTION_CANCEL_URL=${SUBSCRIPTION_CANCEL_URL}
    ports:
      - 3333:3333
    # Use the production command from Dockerfile (pnpm start)
    # No volumes mounted - uses built app inside container
    environment:
      - HOST=0.0.0.0
      - PORT=3333
      - NODE_ENV=production
    # Load runtime environment variables from app/.env
    env_file:
      - ./app/.env
  proxy:
    image: nginx:1.19
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - challenge:/var/www/html
      - certbot-etc:/etc/letsencrypt
      - ./nginx:/etc/nginx/conf.d
    depends_on:
      - app

  certbot:
    depends_on:
      - proxy
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - challenge:/var/www/html
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  certbot-etc:
  challenge:
